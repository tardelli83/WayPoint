{% extends "base.html" %}
{% load static %}

<!-- Page Title -->
{% block title %}Search Trails - Waypoint{% endblock %}

<!-- Main Content -->
{% block content %}
    <h1>Search Trails</h1>

    <!-- Search form -->
    <form method="GET" action="{% url 'search' %}">
        <input type="text" name="q" value="{{ query }}" placeholder="Search for a trail...">
        <button type="submit">Search</button>
    </form>

    <!-- Search results feedback -->
    {% if query %}
        <p>You searched for: <strong>{{ query }}</strong></p>
    {% else %}
        <p>Enter a keyword to start searching.</p>
    {% endif %}

    <br>
    <a href="{% url 'home' %}">Back to Home</a>
{% endblock %}
